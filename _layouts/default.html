<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #0a7cff;
      --text: #1f2933;
      --muted: #667085;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --border: #e4e7ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f4f7;
        --muted: #98a2b3;
        --bg: #101418;
        --surface: #171c22;
        --border: #2d3742;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
    }

    header,
    main,
    footer {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 32px 0 16px;
    }

    nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 15px;
    }

    main {
      margin-bottom: 40px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }

    h1 {
      margin-top: 0;
      line-height: 1.15;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    hr {
      margin: 36px 0;
      border: 0;
      border-top: 1px solid var(--border);
    }

    footer {
      padding: 0 0 32px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/MarketPantry/privacy-policy/' | relative_url }}">MarketPantry Privacy</a>
      <a href="{{ '/V2EX/privacy-policy/' | relative_url }}">V2EX Privacy</a>
      <a href="{{ '/TuneNow/' | relative_url }}">TuneNow</a>
      <a href="{{ '/TuneNow/privacy-policy/' | relative_url }}">TuneNow Privacy</a>
      <a href="{{ '/TuneNow/support/' | relative_url }}">Support</a>
      <a href="{{ '/FreshRadar/' | relative_url }}">FreshRadar</a>
      <a href="{{ '/FreshRadar/privacy-policy/' | relative_url }}">FreshRadar Privacy</a>
      <a href="{{ '/Toilet/privacy-policy/' | relative_url }}">Toilet Privacy</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Public support and privacy information.
  </footer>
</body>
</html>
